# Redis local para VISERVICE (desarrollo).
# Uso: docker compose -f docker-compose.redis.yml up -d
#
# Laravel (.env):
#   REDIS_HOST=127.0.0.1
#   REDIS_PORT=6379
#   CACHE_STORE=redis
#   SESSION_DRIVER=redis   # opcional, cuando lo configuremos

services:
  redis:
    image: redis:7-alpine
    container_name: viservice-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - viservice_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  viservice_redis_data:
